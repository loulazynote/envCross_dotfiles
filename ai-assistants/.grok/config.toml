[cli]
installer = "internal"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-build"
yolo = false
compact_mode = false
permission_mode = "always-approve"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[compat.cursor]
skills = false
rules = false
agents = false
mcps = false
hooks = false
sessions = false

[compat.claude]
skills = false
rules = false
agents = false
mcps = false
hooks = false
sessions = false

[compat.codex]
sessions = false

[plugins]
disabled = [
  "caveman",
  "claude-md-management",
  "code-review",
  "code-simplifier",
  "codex",
  "commit-commands",
  "common-lsp",
  "csharp-lsp",
  "feature-dev",
  "github",
  "gopls-lsp",
  "linear",
  "lua-lsp",
  "playwright",
  "pr-review-toolkit",
  "pyright-lsp",
  "security-guidance",
  "superpowers",
  "typescript-lsp",
]

[mcp_servers.code-review-graph]
command = "uvx"
args = ["code-review-graph", "serve"]

[mcp_servers.mem0]
url = "https://mcp.mem0.ai/mcp"
