personality = "pragmatic"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[features]
multi_agent = true

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 4

[notice]
hide_rate_limit_model_nudge = true

[tui]
status_line = ["model-with-reasoning", "five-hour-limit", "git-branch", "project-name", "pull-request-number", "run-state", "context-used", "used-tokens"]
theme = "dracula"
session_picker_view = "dense"
status_line_use_colors = true

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[plugins."github@openai-curated"]
enabled = true

[plugins."linear@openai-curated"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."caveman@caveman-repo"]
enabled = true

[[skills.config]]
path = "~/.codex/skills/apify-ultimate-scraper/SKILL.md"
enabled = false

[marketplaces.caveman-repo]
last_updated = "2026-06-02T05:19:42Z"
last_revision = "655b7d9c5431f822264b7732e9901c5578ac84cf"
source_type = "git"
source = "https://github.com/JuliusBrussee/caveman.git"

[mcp_servers.code-review-graph]
command = "uvx"
args = ["code-review-graph", "serve"]
type = "stdio"

[mcp_servers.code-review-graph.tools.detect_changes_tool]
approval_mode = "approve"

[mcp_servers.exa]
type = "http"
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,web_search_advanced_exa"
