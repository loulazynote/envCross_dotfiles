name: crawl4ai

services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    pull_policy: always
    container_name: crawl4ai
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?}
      SECRET_KEY: ${CRAWL4AI_SECRET_KEY:?}
    shm_size: 1gb
    restart: unless-stopped
    user: appuser
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    mem_limit: 4g
    mem_reservation: 1g
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:11235/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
